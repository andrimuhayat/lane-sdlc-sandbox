name: agent-gates

# Lane gate for every PR. classify assigns the lane from risk-tiers.yml at the
# base commit; security-audit runs on high-risk PRs that are ready for review;
# gate is the single required check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: agent-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.330"
  PYYAML_VERSION: "6.0.4"
  VERDICT_SCHEMA: >-
    {"type":"object","additionalProperties":false,"required":["verdict","findings"],"properties":{"verdict":{"type":"string","enum":["pass","block"]},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["file","line","severity","title","fix"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["blocker","major","minor"]},"title":{"type":"string"},"fix":{"type":"string"}}}}}}

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install "pyyaml==${PYYAML_VERSION}"
      - id: classify
        name: Assign lane
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # The base commit's classifier judges the PR, so a PR cannot change the code that judges it.
          if git cat-file -e "$BASE:.github/scripts/classify.py" 2>/dev/null; then
            git show "$BASE:.github/scripts/classify.py" > "$RUNNER_TEMP/classify.py"
          else
            cp .github/scripts/classify.py "$RUNNER_TEMP/classify.py"
          fi
          python "$RUNNER_TEMP/classify.py" "$BASE" "$HEAD"

  security-audit:
    needs: classify
    if: needs.classify.outputs.lane == 'high-risk' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Review the diff with the security-audit skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          claude --bare -p "/security-audit Guidance mode only: focused security review of the change from $BASE to $HEAD (run: git diff $BASE...$HEAD). Do not run the six-phase workflow, create an output directory, write files, launch agents, or ask questions. Use verdict block for any exploitable issue. List every finding with file, line and fix. Never print secret values; cite file and line only." \
            --add-dir . \
            --permission-mode dontAsk \
            --allowedTools "Read(./**)" "Grep" "Glob" "Bash(git diff *)" "Bash(git log *)" "Bash(git show *)" \
            --disallowedTools "Bash(git diff *--output*)" "Bash(git diff *--no-index*)" "Read(./.git/**)" \
            --max-turns 60 \
            --max-budget-usd 5 \
            --output-format json \
            --json-schema "$VERDICT_SCHEMA" > audit.json
          verdict=$(jq -r '.structured_output.verdict // empty' audit.json)
          {
            echo "### security-audit: ${verdict:-no verdict}"
            jq -r '.structured_output.findings[]? | "- \(.severity) \(.file):\(.line) \(.title)"' audit.json
            jq -r '"cost_usd: \(.total_cost_usd), turns: \(.num_turns)"' audit.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$verdict" ]; then
            echo "::error::audit returned no verdict ($(jq -r '.subtype' audit.json))"
            exit 1
          fi
          if [ "$verdict" != "pass" ]; then
            echo "::error::security-audit verdict: block"
            exit 1
          fi

  gate:
    if: always()
    needs: [classify, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide
        env:
          EVENT: ${{ github.event_name }}
          CLASSIFY: ${{ needs.classify.result }}
          LANE: ${{ needs.classify.outputs.lane }}
          AUDIT: ${{ needs.security-audit.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then
            echo "gate passed: merge queue"
            exit 0
          fi
          if [ "$CLASSIFY" != "success" ]; then
            echo "::error::gate failed: classify $CLASSIFY"
            exit 1
          fi
          if [ "$LANE" = "high-risk" ] && [ "$AUDIT" != "success" ]; then
            if [ "$DRAFT" = "true" ]; then
              echo "::error::gate failed: high-risk PR in draft; security-audit runs when it is ready for review"
            else
              echo "::error::gate failed: security-audit $AUDIT"
            fi
            exit 1
          fi
          echo "gate passed: lane $LANE"
